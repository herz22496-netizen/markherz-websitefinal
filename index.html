    <style>
        /* Custom styles for an elegant, artistic look fitting for a Montreal Conservatoire alumni */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf9f6; /* Off-white/Alabaster Background */
            color: #2d3748; /* Dark Slate Text */
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .section-title {
            border-bottom: 2px solid #b8985c; /* Refined Gold Accent */
            color: #1a202c;
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            font-size: 2.25rem; 
            font-weight: 700;
        }
        .list-item {
            border-left: 3px solid #b8985c; 
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease-in-out;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .list-item:hover {
            border-left-color: #2d3748; 
            transform: translateX(5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .nav-link {
            position: relative;
            transition: color 0.3s;
            color: #4a5568;
        }
        .nav-link:hover {
            color: #1a202c;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #b8985c;
            transition: width 0.3s;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .text-french {
            color: #718096;
            font-style: italic;
            margin-top: 0.25rem;
            font-weight: 300;
        }
        .btn-primary {
            background-color: #1a202c;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 0.25rem;
            transition: all 0.3s;
            border: 1px solid #1a202c;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn-primary:hover {
            background-color: #b8985c;
            border-color: #b8985c;
            color: #ffffff;
            transform: translateY(-2px);
        }
        /* Custom styling for inputs */
        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            background-color: #ffffff;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #b8985c;
            box-shadow: 0 0 0 3px rgba(184, 152, 92, 0.2);
        }
    </style>
</head>
